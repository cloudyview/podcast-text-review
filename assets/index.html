<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字词人工审校</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.8 system-ui;background:#eef3f9;color:#17324d}header{background:#102d50;color:white;padding:14px 22px;display:flex;justify-content:space-between}header b{font-size:20px}main{display:grid;grid-template-columns:47% 53%;height:calc(100vh - 65px)}aside{padding:18px;overflow:auto}video{width:100%;background:black;border-radius:9px}button,a,input{font:inherit}button,a.btn{background:white;color:#23496d;border:1px solid #bbcde0;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:14px;text-decoration:none}button.primary{background:#1e64ac;color:white}button.danger{color:#a13930}button:disabled{opacity:.45}input{border:1px solid #c6d3e3;border-radius:5px;padding:6px;min-width:0}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0;align-items:center}.card{background:white;padding:13px;border-radius:9px;margin:12px 0}.muted{font-size:13px;color:#61788e;line-height:1.7}#right{background:white;border-left:1px solid #d9e2ed;display:flex;flex-direction:column;overflow:hidden}#tools{padding:14px;border-bottom:1px solid #dbe4ef}#text{overflow:auto;padding:12px 22px;flex:1;user-select:text}.para{padding:12px 0;border-bottom:1px solid #e6edf5;font-size:18px;line-height:2.2}.speaker{display:block;font-size:14px;color:#1768a3;line-height:1.8}.stamp{display:block;color:#3876b2;font-size:12px;border:0;background:transparent;padding:0}.glyph{cursor:text}.glyph:hover{background:#e8f1ff}.glyph.deleted{text-decoration:line-through;background:#ffe9e5;color:#a36c64}.glyph.now{background:#dbebff}::selection{background:#a8cdf6;color:#102d50}#selected{color:#164f8c;font-size:18px;max-height:140px;overflow:auto;white-space:pre-wrap}#warning{color:#966426;font-size:13px}canvas{width:100%;height:105px;background:#f1f6fb;touch-action:none;cursor:crosshair}#notice{color:#a32d23;white-space:pre-wrap}#cuts{max-height:160px;overflow:auto}.cut{font-size:13px;padding:8px 0;border-bottom:1px solid #e9eef5}#search{width:100%}#start,#end{width:140px}label{font-size:14px}@media(max-width:900px){main{display:block;height:auto}#right{height:75vh}video{max-height:40vh}}</style>
<header><b>字词人工审校</b><span id="save">读取中</span></header><main><aside><video id="video" src="/media" controls preload="metadata"></video><div class="bar"><label><input type="checkbox" id="skip" checked> 跳过已删除内容</label><label><input type="checkbox" id="follow" checked> 文字跟随</label><span id="clock" class="muted"></span></div>
<div class="card"><b>直接选字，不按字幕条截断</b><div class="muted">在右侧拖选一个字、一个词或任意一段 → 点“定位所选字词”。先听候选原声，必要时调边界，再确认删除。未精确对齐处须先手动定边界。</div><div class="bar"><button id="locate" class="primary">定位所选字词</button><button id="undo">撤销</button><button id="redo">重做</button></div><div id="selected">尚未选择字词</div><div id="warning"></div></div>
<div class="card"><b>核对这次要删除的声音</b><div class="muted">波形中蓝色范围为候选剪口。点波形可移动较近的起点或终点；按键可微调20毫秒。</div><canvas id="wave" width="1000" height="150"></canvas><div class="bar"><span>开始</span><input id="start" placeholder="00:00:00.000"><button id="sminus">−20ms</button><button id="splus">+20ms</button></div><div class="bar"><span>结束</span><input id="end" placeholder="00:00:00.000"><button id="eminus">−20ms</button><button id="eplus">+20ms</button></div><div class="bar"><button id="hear">只听所选范围</button><button id="join">听删除后的衔接</button><button id="stop">停止试听</button></div><div class="bar"><input id="reason" placeholder="原因（可选）：这个词不喜欢 / 重复 / 跑题" style="flex:1"><button id="confirm" class="danger">确认删除这个范围</button></div><audio id="nativeAudio" controls hidden style="width:100%"></audio><div id="notice" role="alert"></div><div id="status" class="muted"></div></div>
<div class="card"><b>删除记录</b><span id="count" class="muted"></span><div id="cuts"></div><div class="bar"><button id="export">导出记录</button><a class="btn" href="/transcript.txt" download>完整 TXT</a></div></div><p class="muted">每次确认、恢复与撤销均自动保存到当前审校记录。原视频保留。字词时间是机器对齐的候选范围，连读、错字和多字词需结合原声微调；不会按字符数平分时间或无确认直接删除。</p></aside>
<section id="right"><div id="tools"><input id="search" placeholder="查找内容（高亮并定位，不改变原文）"><div class="muted">原话识别工作稿，保留口语；错字、标点和说话人仍需听核。可选任意字词，点击姓名修正标注，点击时间码播放。</div></div><div id="text"></div></section></main>
<script src="/audio-engine.js"></script><script>
const $=id=>document.getElementById(id),video=$('video');let rows=[],glyphs=[],nodes=[],state,choice=null,history=[],future=[],pending=false,audioContext,buffer=null,contextStart=0,contextEnd=0,sources=[],selectedRange=null,auditioned=false,boundarySet=false,textBaseline=null;
const copy=x=>JSON.parse(JSON.stringify(x));function tc(t){let ms=Math.round(t*1000),s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60;return [h,m,s%60].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(ms%1000).padStart(3,'0')}
function parse(s){let a=s.trim().split(':').map(Number);if(!s.trim()||a.length>3||a.some(n=>!Number.isFinite(n)||n<0))throw Error('请输入秒数或 时:分:秒');return a.reduce((x,n)=>60*x+n,0)}function edges(){let a=parse($('start').value),b=parse($('end').value);if(!(0<=a&&a<b&&b<=state.duration))throw Error('请检查起止时间');return [a,b]}function error(e){$('notice').textContent=e.message||String(e)}
const engine=new ReviewAudio({element:$('nativeAudio'),forceNative:new URLSearchParams(location.search).get('audio')==='native'});
function stop(){engine.stop()}
function union(){let out=[];for(let c of copy(state.cuts).sort((a,b)=>a.start-b.start)){let p=out.at(-1);if(p&&c.start<=p.end+.001)p.end=Math.max(p.end,c.end);else out.push(c)}return out}
function render(){nodes.forEach((n,i)=>n.classList.toggle('deleted',state.cuts.some(c=>c.char_in!==undefined&&c.text_baseline===textBaseline?i>=c.char_in&&i<c.char_out:c.start<=glyphs[i].start&&c.end>=glyphs[i].end)));$('cuts').replaceChildren();state.cuts.forEach((c,i)=>{let el=document.createElement('div');el.className='cut';let label=document.createElement('div');label.textContent=(c.text_baseline&&c.text_baseline===textBaseline?'':'旧稿/时间标记：')+tc(c.start)+' → '+tc(c.end)+' '+(c.selected_text||c.reason||'');let restore=document.createElement('button');restore.textContent='恢复';restore.onclick=()=>save(state.cuts.filter((_,j)=>i!==j),'恢复');let edit=document.createElement('button');edit.textContent='试听 / 调整';edit.onclick=async()=>{choice={...c,editing:i};auditioned=false;boundarySet=false;$('selected').textContent=c.selected_text||'按时间选定的范围';$('start').value=tc(c.start);$('end').value=tc(c.end);$('reason').value=c.reason||'';try{await loadAudio(c.start,c.end)}catch(e){error(e)}};el.append(label,restore,edit);$('cuts').append(el)});$('undo').disabled=!history.length||pending;$('redo').disabled=!future.length||pending;$('confirm').disabled=pending||!choice||!auditioned||(!['attention_DTW_token_candidate','forced_alignment_candidate'].includes(choice.alignment)&&!boundarySet);let seconds=union().reduce((x,c)=>x+c.end-c.start,0);$('count').textContent=` · ${state.cuts.length} 处 · 删除 ${seconds.toFixed(2)} 秒`}
async function save(cuts,action,mode='normal'){if(pending)return;pending=true;$('save').textContent='正在保存…';let prev=copy(state.cuts),success=false;try{let r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseline:state.baseline,revision:state.revision,cuts,action,annotations:state.annotations||{}})});if(r.status===409){state=await r.json();throw Error('另一个窗口已更新，已读入最新记录，请重试')}if(!r.ok)throw Error('保存失败，请重试');state=await r.json();success=true;if(mode==='normal'){history.push(prev);future=[]}else if(mode==='annotation'){}else if(mode==='undo'){history.pop();future.push(prev)}else{future.pop();history.push(prev)}$('save').textContent=`已保存 · 第 ${state.revision} 次操作`}catch(e){error(e);$('save').textContent='保存未完成'}finally{pending=false;render()}return success}
function changeSpeaker(cueIds,name,button){if(button.nextElementSibling?.classList.contains('speaker-editor'))return;let box=document.createElement('span'),input=document.createElement('input'),commit=document.createElement('button'),cancel=document.createElement('button');box.className='speaker-editor';input.value=name;input.maxLength=100;input.setAttribute('aria-label','这段的说话人');commit.textContent='保存说话人';cancel.textContent='取消';cancel.onclick=()=>box.remove();commit.onclick=async()=>{let label=input.value.trim();if(!label)return;commit.disabled=true;let before=copy(state.annotations||{}),revision=state.revision;state.annotations||={};state.annotations.speaker_overrides||={};for(let id of cueIds)state.annotations.speaker_overrides[id]=label;if(await save(copy(state.cuts),'修正说话人标注','annotation')){button.textContent=label;box.remove()}else{if(state.revision===revision)state.annotations=before;commit.disabled=false}};box.append(input,commit,cancel);button.after(box);input.focus();}
function build(){let root=$('text'),para,chars=0,start=0,previous=null;rows.forEach(r=>{if(!para||r.speaker!==previous?.speaker||/[。！？!?]$/.test(previous?.text||'')||r.start_seconds-(previous?.end_seconds||0)>.7||chars>=180||r.start_seconds-start>25){para=document.createElement('div');para.className='para';let name=document.createElement('button');name.className='speaker';name.textContent=state.annotations?.speaker_overrides?.[r.cue_id]||r.speaker||'说话人待核';let ids=[];para._cueIds=ids;name.title='点击修正这段说话人';name.onclick=()=>changeSpeaker(ids,name.textContent,name);para.append(name);let stamp=document.createElement('button');stamp.className='stamp';stamp.textContent=tc(r.start_seconds);stamp.onclick=()=>{stop();video.currentTime=r.start_seconds;video.play().catch(error)};para.append(stamp);root.append(para);chars=0;start=r.start_seconds}para._cueIds.push(r.cue_id);for(let ch of Array.from(r.text)){let n=document.createElement('span');n.className='glyph';n.dataset.i=glyphs.length;n.textContent=ch;glyphs.push({text:ch,start:r.start_seconds,end:r.end_seconds,cue:r.cue_id,speaker:r.speaker});nodes.push(n);para.append(n);chars++}previous=r})}
$('text').addEventListener('mouseup',()=>{let selection=window.getSelection();if(!selection||selection.isCollapsed)return;let r=selection.getRangeAt(0),a=r.startContainer.parentElement?.closest('.glyph'),b=r.endContainer.parentElement?.closest('.glyph');if(!a||!b)return;let lo=Number(a.dataset.i)+(r.startOffset>=r.startContainer.textContent.length?1:0),hi=Number(b.dataset.i)-(r.endOffset===0?1:0);if(lo>hi)return;selectedRange={lo,hi};$('selected').textContent=glyphs.slice(lo,hi+1).map(x=>x.text).join('');$('status').textContent='文字已选中；点“定位所选字词”准备原声。'});
$('locate').onclick=async()=>{if(!selectedRange){error(Error('请先在右侧拖选字词'));return}stop();video.pause();$('notice').textContent='';$('status').textContent='正在匹配原声并载入波形…';$('locate').disabled=true;try{let r=await fetch(`/api/selection?lo=${selectedRange.lo}&hi=${selectedRange.hi}`);if(!r.ok)throw Error('字词定位失败');choice=await r.json();choice.text_baseline=textBaseline;auditioned=false;boundarySet=false;$('start').value=tc(choice.start);$('end').value=tc(choice.end);$('selected').textContent=choice.selected_text;$('warning').textContent=choice.warning;await loadAudio(choice.start,choice.end);render()}catch(e){error(e)}finally{$('locate').disabled=false}};
async function loadAudio(a,b){if(b-a>170)throw Error('这次选段超过170秒，请分成几段审校');contextStart=Math.max(0,a-3);contextEnd=Math.min(state.duration,b+3);await engine.load(contextStart,contextEnd);buffer={getChannelData:()=>engine.samples};$('status').textContent=`已载入原声 ${tc(contextStart)}—${tc(contextEnd)}；可波形定界并试听。`;draw()}
function draw(){let canvas=$('wave'),g=canvas.getContext('2d');g.clearRect(0,0,canvas.width,canvas.height);if(!buffer)return;let data=buffer.getChannelData(0),width=canvas.width,height=canvas.height;g.strokeStyle='#3b7099';g.beginPath();for(let x=0;x<width;x++){let a=Math.floor(x*data.length/width),b=Math.floor((x+1)*data.length/width),peak=0;for(let i=a;i<b;i++)peak=Math.max(peak,Math.abs(data[i]));g.moveTo(x,height/2-peak*height*.46);g.lineTo(x,height/2+peak*height*.46)}g.stroke();try{let [a,b]=edges(),xa=(a-contextStart)/(contextEnd-contextStart)*width,xb=(b-contextStart)/(contextEnd-contextStart)*width;g.fillStyle='#2787da33';g.fillRect(xa,0,xb-xa,height);g.fillStyle='#1767ac';g.fillRect(xa,0,2,height);g.fillRect(xb,0,2,height)}catch{}}
$('wave').onclick=e=>{if(!buffer)return;boundarySet=true;auditioned=false;let [a,b]=edges(),rect=$('wave').getBoundingClientRect(),t=contextStart+(e.clientX-rect.left)/rect.width*(contextEnd-contextStart);if(Math.abs(t-a)<Math.abs(t-b))$('start').value=tc(Math.min(t,b-.01));else $('end').value=tc(Math.max(t,a+.01));draw();render()};for(let [id,target,delta]of[['sminus','start',-.02],['splus','start',.02],['eminus','end',-.02],['eplus','end',.02]])$(id).onclick=()=>{try{boundarySet=true;auditioned=false;$(target).value=tc(Math.max(0,parse($(target).value)+delta));draw();render()}catch(e){error(e)}};for(let id of ['start','end'])$(id).onchange=()=>{boundarySet=true;auditioned=false;draw();render()};
function keptContext(marks,start,end){let cursor=start,parts=[];for(let c of [...marks].sort((x,y)=>x.start-y.start)){if(c.end<=cursor||c.start>=end)continue;if(c.start>cursor)parts.push([cursor,Math.min(end,c.start)]);cursor=Math.max(cursor,c.end)}if(cursor<end)parts.push([cursor,end]);return parts}
async function playSegments(parts){video.pause();let mode=await engine.play(parts);if(mode==='html-audio-needs-click')$('status').textContent='浏览器需要手动播放：请点下方音频播放器播放键';else if(mode==='html-audio')$('status').textContent='正在使用普通音频播放器回退试听';}
$('hear').onclick=async()=>{try{await playSegments([edges()]);auditioned=true;render()}catch(e){error(e)}};$('join').onclick=async()=>{try{let [a,b]=edges();let parts=keptContext([...state.cuts,{start:a,end:b}],Math.max(contextStart,a-2),Math.min(contextEnd,b+2));if(!parts.length)throw Error('当前上下文全部已被标记删除，请用整片跳接试听');await playSegments(parts);auditioned=true;render()}catch(e){error(e)}};$('stop').onclick=stop;
$('confirm').onclick=async()=>{try{let [a,b]=edges();let c={...choice,start:a,end:b,reason:$('reason').value,boundaries_reviewed_by_user:true};delete c.editing;let cuts=copy(state.cuts);if(choice.editing!==undefined)cuts[choice.editing]=c;else cuts.push(c);if(await save(cuts,'字词选择后确认删除')){choice=null;render();stop()}}catch(e){error(e)}};$('undo').onclick=()=>history.length&&save(copy(history.at(-1)),'撤销','undo');$('redo').onclick=()=>future.length&&save(copy(future.at(-1)),'重做','redo');$('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='字词审校记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
$('search').oninput=()=>{let q=$('search').value;if(!q)return;let full=glyphs.map(x=>x.text).join(''),index=full.indexOf(q);if(index>=0){let range=document.createRange();range.setStartBefore(nodes[index]);range.setEndAfter(nodes[index+Array.from(q).length-1]);window.getSelection().removeAllRanges();window.getSelection().addRange(range);nodes[index].scrollIntoView({block:'center'});selectedRange={lo:index,hi:index+Array.from(q).length-1};$('selected').textContent=q}else $('status').textContent='未找到这段文字'};
let activeCue;video.ontimeupdate=()=>{if(!state)return;let t=video.currentTime;if($('skip').checked&&!video.seeking){let c=union().find(c=>t>=c.start&&t<c.end);if(c){video.currentTime=c.end;return}}$('clock').textContent=tc(t);let row=rows.find(r=>r.start_seconds<=t&&r.end_seconds>t);if(row&&row.cue_id!==activeCue){nodes.forEach((n,i)=>n.classList.toggle('now',glyphs[i].cue===row.cue_id));activeCue=row.cue_id;if($('follow').checked){let n=nodes[glyphs.findIndex(g=>g.cue===row.cue_id)],rect=n.getBoundingClientRect(),panel=$('text').getBoundingClientRect();if(rect.top<panel.top||rect.bottom>panel.bottom)n.scrollIntoView({block:'center'})}}};
Promise.all([fetch('/api/session').then(r=>r.json()),fetch('/api/transcript').then(r=>r.json()),fetch('/api/state').then(r=>r.json())]).then(([config,t,s])=>{textBaseline=config.text_baseline||config.baseline;document.title=config.title+' · 字词人工审校';document.querySelector('header b').textContent=config.title;rows=t.rows;state=s;build();render();$('save').textContent=`已载入 · 第 ${state.revision} 次操作`}).catch(error);window.addEventListener('beforeunload',e=>{if(pending){e.preventDefault();e.returnValue='正在保存'}});
</script></html>
